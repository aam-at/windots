# psmux (tmux for Windows), with the key interface of ~/dotfiles/config/tmux
# as rmux runs it (gpakosz + tmux.conf.local + plugins). gpakosz's sh/awk/perl
# framework can't run here, so its look and keys are restated; plugin keys
# go to psmux's own commands, psmux-plugins, or the scripts beside this file.
# Keep `run` and `#()` out of hot paths: psmux runs them through pwsh.

set -g default-terminal "xterm-256color"
set -g allow-passthrough on
set -g history-limit 10000
set -g status-keys vi
set -g mode-keys vi
set -s escape-time 0
setw -g aggressive-resize on
set -g focus-events on
set -g mouse off  # psmux defaults it on; gpakosz off, m toggles
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# gpakosz
bind C-c new-session
bind C-e send-keys C-l \; clear-history
bind e new-window -n psmux.conf "nvim ~/.config/psmux/psmux.conf"
bind r source-file ~/.config/psmux/psmux.conf \; display "psmux.conf sourced"
bind m set -g mouse \; display "mouse #{?mouse,on,off}"
bind b split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R
bind -r + resize-pane -U 2
bind -r - resize-pane -D 2
bind -r < resize-pane -L 2
bind -r > resize-pane -R 2
bind -r C-Up resize-pane -U
bind -r C-Down resize-pane -D
bind -r C-Left resize-pane -L
bind -r C-Right resize-pane -R
bind -r M-Up resize-pane -U 5
bind -r M-Down resize-pane -D 5
bind -r M-Left resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r C-h previous-window
bind -r C-l next-window
bind a last-window
bind l last-window
bind BTab switch-client -l
bind Enter copy-mode
bind p paste-buffer -p
# tmux defaults psmux doesn't bind
bind f command-prompt "find-window -Z '%%'"
bind . command-prompt "move-window -t '%%'"
bind / command-prompt -k -p key "list-keys -1N '%%'"
bind B list-buffers
bind C-n next-window
bind C-p previous-window
bind C-o rotate-window
bind M-n next-window -a
bind C-z suspend-client
bind D choose-client -Z
bind E select-layout -E
bind M-6 select-layout main-horizontal-mirrored
bind M-7 select-layout main-vertical-mirrored
bind '~' show-messages
# tmux-sensible's R reload; gpakosz's M maximize, as zoom here
bind R source-file ~/.config/psmux/psmux.conf \; display "psmux.conf sourced"
bind M resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind & confirm-before -p "kill-window #W? (y/n)" kill-window

# vim-tmux-navigator; a format test, not a shell per keypress
bind -n C-h if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-h" "select-pane -L"
bind -n C-j if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-j" "select-pane -D"
bind -n C-k if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-k" "select-pane -U"
bind -n C-l if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-l" "select-pane -R"
bind -n 'C-\' if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send 'C-\\'" "last-pane"

# copy mode (gpakosz; y/Enter copy to the Windows clipboard, tmux-yank's job)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-selection-and-cancel \; paste-buffer -p
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# tmux-yank: Y copies the pane's directory
bind Y run 'Set-Clipboard "#{pane_current_path}"'

# tmux-sessionist: g go to, C new, X kill, S/L last session, t join a pane
bind g command-prompt -p "session:" "switch-client -t '%%'"
bind C command-prompt -p "new session:" "new-session -A -s '%%'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind S switch-client -l
bind L switch-client -l
bind t command-prompt -p "join pane from:" "join-pane -h -s '%%'"

# tmux-copycat's searches (C-u urls, C-g files, M-h hashes, M-i IPs, C-d
# numbers), as an fzf pick of matches: Enter opens, ctrl-y copies.
bind C-u display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} url"
bind C-g display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} path"
bind M-h display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} hash"
bind C-d display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} digit"
# tmux-fzf
bind C-f display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/switch.ps1"

# gpakosz's theme as its framework renders it under rmux (tmux-digit's
# circled numbers included), copied so both look the same; regenerate from
# `rmux show -gv <option>` if tmux.conf.local's theme changes. psmux needs
# three edits: the username as #{user}; #{==:#S,…} and #{==:#I,…} with
# #{session_name}/#{window_index} (it misreads the short aliases there);
# "#[…,none]" as "#[default]#[…]" (it drops a style it can't parse).
set -g status-style 'fg=#a89984,bg=#282828,none'
set -g status-left-style 'fg=#a89984,bg=#282828,none'
set -g status-right-style 'fg=#a89984,bg=#282828,none'
set -g status-left '#[fg=#282828,bg=#fabd2f,bold] ❐ #{?#{==:#{session_name},0},⓪,}#{?#{==:#{session_name},1},①,}#{?#{==:#{session_name},2},②,}#{?#{==:#{session_name},3},③,}#{?#{==:#{session_name},4},④,}#{?#{==:#{session_name},5},⑤,}#{?#{==:#{session_name},6},⑥,}#{?#{==:#{session_name},7},⑦,}#{?#{==:#{session_name},8},⑧,}#{?#{==:#{session_name},9},⑨,}#{?#{==:#{session_name},10},⑩,}#{?#{==:#{session_name},11},⑪,}#{?#{==:#{session_name},12},⑫,}#{?#{==:#{session_name},13},⑬,}#{?#{==:#{session_name},14},⑭,}#{?#{==:#{session_name},15},⑮,}#{?#{==:#{session_name},16},⑯,}#{?#{==:#{session_name},17},⑰,}#{?#{==:#{session_name},18},⑱,}#{?#{==:#{session_name},19},⑲,}#{?#{==:#{session_name},20},⑳,} #[default]#[fg=#fabd2f,bg=#d3869b]#[default]#[fg=#fbf1c7,bg=#d3869b] #{user}#[fg=none]#[bg=none]#[bold,blink]#{?#{==:#{user},root},!,}#[default]#[default]#[fg=#fbf1c7,bg=#d3869b] #[default]#[fg=#d3869b,bg=#282828] '
set -g status-right '#[default]#[fg=#282828,bg=#282828]#[default]#[fg=#a89984,bg=#282828] #[fg=none]#[bg=none]#[none]#{?client_prefix,⌨ ,  }#[default]#[default]#[fg=#a89984,bg=#282828]#[fg=none]#[bg=none]#[none]#{?mouse,↗ ,  }#[default]#[default]#[fg=#a89984,bg=#282828]#[fg=none]#[bg=none]#[none]#{?session_many_attached,⚇ ,}#[default]#[default]#[fg=#a89984,bg=#282828]#[fg=none]#[bg=none]#[none]#{?pane_synchronized,⚏ ,}#[default]#[default]#[fg=#a89984,bg=#282828]#[default]#[fg=#a89984,bg=#282828] %R #[default]#[fg=#a89984,bg=#282828] %d %b %a #[default]#[fg=#fb4934,bg=#282828]#[default]#[fg=#d5c4a1,bg=#fb4934] #h'
set -g status-left-length '1000'
set -g status-right-length '1000'
set -g status-justify 'left'
set -g window-status-style 'fg=#a89984,bg=#282828,none'
set -g window-status-current-style 'fg=#282828,bg=#83a598,bold'
set -g window-status-last-style 'fg=#83a598,bg=#3c3836,none'
set -g window-status-activity-style 'fg=default,bg=default,underscore'
set -g window-status-bell-style 'fg=#fabd2f,bg=default,blink,bold'
set -g window-status-format '#[default]#[fg=#282828,bg=#282828]#{?window_last_flag,#[bg=#3c3836],}#{?window_activity_flag,,}#{?window_bell_flag,,}#[default]#[fg=#a89984,bg=#282828]#{?window_last_flag,#[fg=#83a598],}#{?window_last_flag,#[bg=#3c3836],}#{?window_activity_flag,,}#{?window_activity_flag,,}#{?window_bell_flag,#[fg=#fabd2f],}#{?window_bell_flag,,}#{?window_last_flag,#{?window_activity_flag,#{?window_bell_flag, , },#{?window_bell_flag, , }},#{?window_activity_flag,#{?window_bell_flag,,},#{?window_bell_flag,,}}}#{?window_last_flag,#[none],}#{?window_last_flag,#[none],}#{?window_activity_flag,#[none],}#{?window_activity_flag,#[underscore],}#{?window_bell_flag,#[blink],}#{?window_bell_flag,#[bold],}#{?#{==:#{window_index},0},⓪,}#{?#{==:#{window_index},1},①,}#{?#{==:#{window_index},2},②,}#{?#{==:#{window_index},3},③,}#{?#{==:#{window_index},4},④,}#{?#{==:#{window_index},5},⑤,}#{?#{==:#{window_index},6},⑥,}#{?#{==:#{window_index},7},⑦,}#{?#{==:#{window_index},8},⑧,}#{?#{==:#{window_index},9},⑨,}#{?#{==:#{window_index},10},⑩,}#{?#{==:#{window_index},11},⑪,}#{?#{==:#{window_index},12},⑫,}#{?#{==:#{window_index},13},⑬,}#{?#{==:#{window_index},14},⑭,}#{?#{==:#{window_index},15},⑮,}#{?#{==:#{window_index},16},⑯,}#{?#{==:#{window_index},17},⑰,}#{?#{==:#{window_index},18},⑱,}#{?#{==:#{window_index},19},⑲,}#{?#{==:#{window_index},20},⑳,} #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,}#[none]#{?window_last_flag,#{?window_activity_flag,#{?window_bell_flag, , },#{?window_bell_flag, , }},#{?window_activity_flag,#{?window_bell_flag,,},#{?window_bell_flag,,}}}#[fg=#282828,bg=#282828]#{?window_last_flag,#[fg=#3c3836],}#{?window_activity_flag,,}#{?window_bell_flag,,}'
set -g window-status-current-format '#[default]#[fg=#282828,bg=#83a598]#[fg=#282828,bg=#83a598,bold] #{?#{==:#{window_index},0},⓪,}#{?#{==:#{window_index},1},①,}#{?#{==:#{window_index},2},②,}#{?#{==:#{window_index},3},③,}#{?#{==:#{window_index},4},④,}#{?#{==:#{window_index},5},⑤,}#{?#{==:#{window_index},6},⑥,}#{?#{==:#{window_index},7},⑦,}#{?#{==:#{window_index},8},⑧,}#{?#{==:#{window_index},9},⑨,}#{?#{==:#{window_index},10},⑩,}#{?#{==:#{window_index},11},⑪,}#{?#{==:#{window_index},12},⑫,}#{?#{==:#{window_index},13},⑬,}#{?#{==:#{window_index},14},⑭,}#{?#{==:#{window_index},15},⑮,}#{?#{==:#{window_index},16},⑯,}#{?#{==:#{window_index},17},⑰,}#{?#{==:#{window_index},18},⑱,}#{?#{==:#{window_index},19},⑲,}#{?#{==:#{window_index},20},⑳,} #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} #[fg=#83a598,bg=#282828]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#3c3836,bg=default'
set -g pane-active-border-style 'fg=#{?pane_in_mode,#fabd2f,#{?synchronize-panes,#fb4934,#83a598}},bg=default'
set -g message-style 'fg=#282828,bg=#fabd2f,bold'
set -g message-command-style 'fg=#fabd2f,bg=#282828,bold'
set -g mode-style 'fg=#282828,bg=#fabd2f,bold'
set -g clock-mode-colour '#83a598'
set -g set-titles-string '#h ❐ #{?#{==:#{session_name},0},⓪,}#{?#{==:#{session_name},1},①,}#{?#{==:#{session_name},2},②,}#{?#{==:#{session_name},3},③,}#{?#{==:#{session_name},4},④,}#{?#{==:#{session_name},5},⑤,}#{?#{==:#{session_name},6},⑥,}#{?#{==:#{session_name},7},⑦,}#{?#{==:#{session_name},8},⑧,}#{?#{==:#{session_name},9},⑨,}#{?#{==:#{session_name},10},⑩,}#{?#{==:#{session_name},11},⑪,}#{?#{==:#{session_name},12},⑫,}#{?#{==:#{session_name},13},⑬,}#{?#{==:#{session_name},14},⑭,}#{?#{==:#{session_name},15},⑮,}#{?#{==:#{session_name},16},⑯,}#{?#{==:#{session_name},17},⑰,}#{?#{==:#{session_name},18},⑱,}#{?#{==:#{session_name},19},⑲,}#{?#{==:#{session_name},20},⑳,} ● #{?#{==:#{window_index},0},⓪,}#{?#{==:#{window_index},1},①,}#{?#{==:#{window_index},2},②,}#{?#{==:#{window_index},3},③,}#{?#{==:#{window_index},4},④,}#{?#{==:#{window_index},5},⑤,}#{?#{==:#{window_index},6},⑥,}#{?#{==:#{window_index},7},⑦,}#{?#{==:#{window_index},8},⑧,}#{?#{==:#{window_index},9},⑨,}#{?#{==:#{window_index},10},⑩,}#{?#{==:#{window_index},11},⑪,}#{?#{==:#{window_index},12},⑫,}#{?#{==:#{window_index},13},⑬,}#{?#{==:#{window_index},14},⑭,}#{?#{==:#{window_index},15},⑮,}#{?#{==:#{window_index},16},⑯,}#{?#{==:#{window_index},17},⑰,}#{?#{==:#{window_index},18},⑱,}#{?#{==:#{window_index},19},⑲,}#{?#{==:#{window_index},20},⑳,} #W'

# psmux sources each plugin's plugin.conf at its @plugin line; Setup's Links
# step installs them. tmux-resurrect's C-s save / C-r restore come as is.
set -g @plugin 'psmux-plugins/psmux-logging'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'btm btop vim nvim hx emacs'
# tmux-logging's keys: P toggle, M-p screen, M-P history, M-c clear
bind P run-shell 'pwsh -NoProfile -File "~/.psmux/plugins/psmux-logging/scripts/toggle_logging.ps1"'
# M-S-p: psmux's config parser reads M-P as M-p
bind M-S-p run-shell 'pwsh -NoProfile -File "~/.psmux/plugins/psmux-logging/scripts/capture_history.ps1"'
bind M-i display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} ip"
bind M-o rotate-window -D  # after psmux-logging, which binds it
