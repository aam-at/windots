# psmux (tmux for Windows), with the key interface of ~/dotfiles/config/tmux
# as rmux runs it (gpakosz + tmux.conf.local + plugins). gpakosz's sh/awk/perl
# framework can't run here, so its look and keys are restated; plugin keys
# go to psmux's own commands, psmux-plugins, or the scripts beside this file.
# Keep `run` and `#()` out of hot paths: psmux runs them through pwsh.

set -g default-terminal "xterm-256color"
set -g allow-passthrough on
set -g history-limit 10000
set -g status-keys vi
set -g mode-keys vi
set -s escape-time 0
setw -g aggressive-resize on
set -g focus-events on
set -g mouse off  # psmux defaults it on; gpakosz off, m toggles
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#h ❐ #S ● #I #W"
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# gpakosz
bind C-c new-session
bind C-e send-keys C-l \; clear-history
bind e new-window -n psmux.conf "nvim ~/.config/psmux/psmux.conf"
bind r source-file ~/.config/psmux/psmux.conf \; display "psmux.conf sourced"
bind m set -g mouse \; display "mouse #{?mouse,on,off}"
bind b split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R
bind -r + resize-pane -U 2
bind -r - resize-pane -D 2
bind -r < resize-pane -L 2
bind -r > resize-pane -R 2
bind -r C-Up resize-pane -U
bind -r C-Down resize-pane -D
bind -r C-Left resize-pane -L
bind -r C-Right resize-pane -R
bind -r M-Up resize-pane -U 5
bind -r M-Down resize-pane -D 5
bind -r M-Left resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r C-h previous-window
bind -r C-l next-window
bind a last-window
bind l last-window
bind BTab switch-client -l
bind Enter copy-mode
bind p paste-buffer -p
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind & confirm-before -p "kill-window #W? (y/n)" kill-window

# vim-tmux-navigator; a format test, not a shell per keypress
bind -n C-h if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-h" "select-pane -L"
bind -n C-j if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-j" "select-pane -D"
bind -n C-k if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-k" "select-pane -U"
bind -n C-l if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send C-l" "select-pane -R"
bind -n 'C-\' if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" "send 'C-\\'" "last-pane"

# copy mode (gpakosz; y/Enter copy to the Windows clipboard, tmux-yank's job)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-selection-and-cancel \; paste-buffer -p
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# tmux-yank: Y copies the pane's directory
bind Y run 'Set-Clipboard "#{pane_current_path}"'

# tmux-sessionist: g go to, C new, X kill, S/L last session, t join a pane
bind g command-prompt -p "session:" "switch-client -t '%%'"
bind C command-prompt -p "new session:" "new-session -A -s '%%'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind S switch-client -l
bind L switch-client -l
bind t command-prompt -p "join pane from:" "join-pane -h -s '%%'"

# tmux-copycat's searches (C-u urls, C-g files, M-h hashes, M-i IPs, C-d
# numbers), as an fzf pick of matches: Enter opens, ctrl-y copies.
bind C-u display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} url"
bind C-g display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} path"
bind M-h display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} hash"
bind C-d display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} digit"
# tmux-fzf
bind C-f display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/switch.ps1"

# gpakosz's gruvbox layout on the shared palette. @sysstat (CPU, memory) is
# psmux-agent.exe's, which also runs aw-watcher-tmux and continuum's
# auto-save and restore.
source-file ~/.config/theme/tmux.conf
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=#282828,bg=#fabd2f,bold] ❐ #S #[fg=#fbf1c7,bg=#d3869b,nobold] #{user} #[default] "
set -g status-right "#{?client_prefix,⌨ ,}#{?mouse,↗ ,}#{?pane_synchronized,⚏ ,}#{@sysstat} , %R , %d %b %a #[fg=#d5c4a1,bg=#fb4934] #H "
setw -g window-status-format " #I #W#{?window_bell_flag, !,}#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format " #I #W#{?window_bell_flag, !,}#{?window_zoomed_flag, Z,} "
setw -g window-status-separator ""
set -g pane-active-border-style "fg=#{?pane_in_mode,#fabd2f,#{?synchronize-panes,#fb4934,#83a598}}"

# psmux sources each plugin's plugin.conf at its @plugin line; Setup's Links
# step installs them. tmux-resurrect's C-s save / C-r restore come as is.
set -g @plugin 'psmux-plugins/psmux-logging'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'btm btop vim nvim hx emacs'
# tmux-logging's keys: P toggle, M-p screen, M-P history, M-c clear
unbind M-o
bind P run-shell 'pwsh -NoProfile -File "~/.psmux/plugins/psmux-logging/scripts/toggle_logging.ps1"'
# M-S-p: psmux's config parser reads M-P as M-p
bind M-S-p run-shell 'pwsh -NoProfile -File "~/.psmux/plugins/psmux-logging/scripts/capture_history.ps1"'
bind M-i display-popup -E -w 80% -h 60% "pwsh -NoProfile -File ~/.config/psmux/pick.ps1 #{pane_id} ip"
