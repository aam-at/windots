# rmux: runs ~/dotfiles/config/tmux (gpakosz + tmux.conf.local) unchanged.
# Its framework is sh/awk/perl, so run-shell goes through Git's sh; panes
# still get pwsh. `tmux` (beside this file) is what the framework and TPM
# plugins call. Paths use / : the framework's sed and perl read \U, \a as
# escapes.
setenv -gF WINHOME "#{s|\\|/|:HOME}"
# Scoop's Git sh, in $SCOOP when Scoop lives elsewhere (as setup assumes).
set -gF default-shell "#{?SCOOP,#{s|\\|/|:SCOOP},#{WINHOME}/scoop}/apps/git/current/usr/bin/sh.exe"
set -g default-command pwsh
# tmux.conf's, needed before the first window, which exists before it loads.
set -g base-index 1
setw -g pane-base-index 1
setenv -gF TMUX_PROGRAM "#{WINHOME}/AppData/Roaming/rmux/tmux"
# Bare `tmux` in their jobs must be that, not psmux's tmux.
setenv -gF PATH "#{WINHOME}/AppData/Roaming/rmux;#{PATH}"
setenv -gF TMUX_CONF "#{WINHOME}/dotfiles/config/tmux/tmux.conf"
setenv -gF TMUX_CONF_LOCAL "#{WINHOME}/dotfiles/config/tmux/tmux.conf.local"
# tmux-continuum's auto-save starts save.sh in the background of a status
# #() job, which rmux kills with the job; this loop does the saving instead.
run -b 'while i=$(tmux show -gv @continuum-save-interval 2>/dev/null); sleep $((${i:-15} * 60)); tmux ls >/dev/null 2>&1; do "${TMUX_CONF%/*}/plugins/tmux-resurrect/scripts/save.sh" quiet; done'
# load.sh loads the config (from a snapshot when it's current) once the
# server answers: rmux rejects every command, new-session too, until its
# config has loaded, and the full load takes minutes.
run -b 'until tmux show -gv prefix >/dev/null 2>&1; do sleep 0.2; done; "${TMUX_PROGRAM%/*}/load.sh"'
