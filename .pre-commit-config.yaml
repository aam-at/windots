repos:
  # AutoHotkey has no CLI formatter (formatting lives only in editor
  # extensions), so normalize whitespace with prek's built-in fixers.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        files: \.ahk$
      - id: end-of-file-fixer
        files: \.ahk$
      - id: mixed-line-ending
        args: [--fix=lf]
        files: \.ahk$
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c]
  - repo: local
    hooks:
      - id: format-powershell
        name: Format PowerShell
        language: system
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/Format-PowerShell.ps1
        files: \.ps1$
      - id: test-windots
        name: Validate PowerShell, AutoHotkey and C
        language: system
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/Test-Windots.ps1
        files: \.(ps1|ahk|c)$
        require_serial: true
