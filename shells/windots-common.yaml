PackageName: windots.Common
Name: windots
# The keys in shells\Niri-Common.ahk, the same in both desktop modes; each
# mode's own manifest (native\ or komorebi\) adds its window keys.
WindowFilter: "AutoHotkeyUX.exe"
BackgroundProcess: true
Shortcuts:
  - SectionName: Launchers
    Properties:
      - Name: Shortcut Guide
        Description: This overlay
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - "/"
      - Name: Quick Launch
        Description: YASB launcher; prefixes like cb, =, / pick a provider
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Space
      - Name: Command Palette
        Description: PowerToys launcher
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - Space
      - Name: Open terminal
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - T
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "<Enter>"
      - Name: Scratch terminal
        Description: Windows Terminal quake window
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "`"
      - Name: WhatsApp
        Description: "Chat scratchpad: show or hide"
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - W
      - Name: Teams
        Description: "Chat scratchpad: show or hide"
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - W
      - Name: File Explorer
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - E
      - Name: Browser
        Description: System default browser
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - B
      - Name: Editor
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - C
      - Name: Copilot
        Description: Microsoft 365 Copilot. Also the Copilot key
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - A
      - Name: Voice typing / dictation
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - S

  - SectionName: Windows AI
    Properties:
      - Name: Click to Do
        Description: Act on text or an image on screen
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "Z"
      - Name: AI search
        Description: Windows Search by description
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "/"
  - SectionName: Shell Panels
    Properties:
      - Name: Session menu
        Description: Lock, sleep, hibernate, log out, restart, shut down
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - X
      - Name: Lock screen
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - L
      - Name: Clipboard history
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - V
      - Name: Quick settings
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - M
      - Name: Notification Center
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - N
      - Name: Do Not Disturb
        Description: Toggle notifications off and on
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - N
      - Name: Focus mode
        Description: "Wellbeing: Do Not Disturb and nudges for distracting apps and sites"
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - Z
      - Name: Bedtime
        Description: "Wellbeing: grayscale and Do Not Disturb on or off"
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - S
      - Name: Change wallpaper
        Shortcut:
