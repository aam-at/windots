PackageName: windots.Komorebi
Name: Komorebi (windots)
WindowFilter: "komorebi.exe"
BackgroundProcess: true
Shortcuts:
  - SectionName: Overview and Launchers
    Properties:
      - Name: Overview
        Description: Komorebi workspace overview; Shift+pick takes the window
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - D
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Tab
      - Name: Shortcut Guide
        Description: This overlay
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - "/"
      - Name: Command Palette
        Description: PowerToys launcher
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Space
      - Name: Open terminal
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - T
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "<Enter>"
      - Name: Scratch terminal
        Description: Windows Terminal quake window
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "`"
      - Name: WhatsApp
        Description: Chat scratchpad: show or hide
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - W
      - Name: Teams
        Description: Chat scratchpad: show or hide
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - W
      - Name: File Explorer
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - E
      - Name: Browser
        Description: System default browser
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - B
      - Name: Editor
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - C
      - Name: Copilot
        Description: Microsoft 365 Copilot. Also the Copilot key
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - A
      - Name: Voice typing / dictation
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - S

  - SectionName: Windows AI
    Properties:
      - Name: Click to Do
        Description: Act on text or an image on screen
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "Z"
      - Name: AI search
        Description: Windows Search by description
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "/"
  - SectionName: Shell Panels
    Properties:
      - Name: Session menu
        Description: Lock, sleep, hibernate, log out, restart, shut down
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - X
      - Name: Lock screen
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - L
      - Name: Clipboard history
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - V
      - Name: Quick settings
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - M
      - Name: Notification Center
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - N
      - Name: Do Not Disturb
        Description: Toggle notifications off and on
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - N
      - Name: Change wallpaper
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Y
      - Name: Personalization settings
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - ","

  - SectionName: Window Management
    Properties:
      - Name: Close window
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Q
      - Name: Maximize column
        Description: Komorebi monocle
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - F
      - Name: Toggle maximize
        Description: Native maximize
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - F
      - Name: Toggle floating
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - T
      - Name: Switch focus between floating and tiling
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - V

  - SectionName: Focus
    Properties:
      - Name: Focus column left
        Description: Also Win+Left
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - H
      - Name: Focus window down in column
        Description: Next window in the stack. Also Win+Down
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - J
      - Name: Focus window up in column
        Description: Previous window in the stack. Also Win+Up
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - K
      - Name: Focus column right
        Description: Also Win+Right
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - L
      - Name: Focus monitor left
        Description: Also Win+Ctrl+Left
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - H
      - Name: Focus monitor right
        Description: Also Win+Ctrl+Right
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - L

  - SectionName: Columns
    Properties:
      - Name: Move column left
        Description: Also Win+Shift+Left
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - H
      - Name: Move window down in column
        Description: Also Win+Shift+Down
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - J
      - Name: Move window up in column
        Description: Also Win+Shift+Up
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - K
      - Name: Move column right
        Description: Also Win+Shift+Right
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - L
      - Name: Consume window into column left
        Description: Stack left
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "["
      - Name: Consume window into column right
        Description: Stack right
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "]"
      - Name: Expel window from column
        Description: Unstack
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "."
      - Name: Move column to monitor left
        Description: Also Win+Shift+Ctrl+Left
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: true
            Alt: false
            Keys:
              - H
      - Name: Move column to monitor right
        Description: Also Win+Shift+Ctrl+Right
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: true
            Alt: false
            Keys:
              - L

  - SectionName: Sizing
    Properties:
      - Name: Cycle column width
        Description: 3, 2 or 1 visible columns
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - R
      - Name: Narrower / wider
        Description: Add Shift for height
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "-"
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "="

  - SectionName: Workspaces
    Properties:
      - Name: Go to workspace 1-9
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "1"
      - Name: Move window to workspace 1-9
        Description: Follows the window there
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - "1"
      - Name: Next workspace
        Description: Also scroll down while holding Win
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - U
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - PgDn
      - Name: Previous workspace
        Description: Also scroll up while holding Win
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - I
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - PgUp
      - Name: Move window to next workspace
        Description: Also scroll down while holding Win+Ctrl
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - U
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - "<Down>"
      - Name: Move window to previous workspace
        Description: Also scroll up while holding Win+Ctrl
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - I
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - "<Up>"

  - SectionName: System
    Properties:
      - Name: Turn off display
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - P
      - Name: Pause these shortcuts
        Description: Hand Win chords back to Windows; press again to resume
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Esc
