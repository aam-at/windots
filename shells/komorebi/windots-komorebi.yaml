PackageName: windots.Komorebi
Name: Komorebi (windots)
WindowFilter: "komorebi.exe"
BackgroundProcess: true
Shortcuts:
  - SectionName: Window Manager
    Properties:
      - Name: Close window
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - Q
      - Name: Minimize window
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - M
      - Name: Retile
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - R
      - Name: Toggle pause
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - P

  - SectionName: Focus
    Properties:
      - Name: Focus left
        Recommended: true
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - H
      - Name: Focus down
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - J
      - Name: Focus up
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - K
      - Name: Focus right
        Recommended: true
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - L
      - Name: Cycle focus previous
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: true
            Alt: true
            Keys:
              - "["
      - Name: Cycle focus next
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: true
            Alt: true
            Keys:
              - "]"

  - SectionName: Move Windows
    Properties:
      - Name: Move window left
        Recommended: true
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: true
            Alt: true
            Keys:
              - H
      - Name: Move window down
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: true
            Alt: true
            Keys:
              - J
      - Name: Move window up
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: true
            Alt: true
            Keys:
              - K
      - Name: Move window right
        Recommended: true
        Shortcut:
          - Win: false
            Ctrl: false
            Shift: true
            Alt: true
