PackageName: windots.NativeDesktop
Name: Native Desktop (windots)
WindowFilter: "WindowsVirtualDesktopHelper.exe"
BackgroundProcess: true
Shortcuts:
  - SectionName: Overview
    Properties:
      - Name: Overview
        Description: Task view
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - D
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Tab

  - SectionName: Window Management
    Properties:
      - Name: Close window
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Q
      - Name: Toggle maximize
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - F
      - Name: Toggle fullscreen
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - F
      - Name: Toggle always on top
        Description: PowerToys Always On Top
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - T
      - Name: Center window
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - C

  - SectionName: Focus
    Properties:
      - Name: Focus window left
        Description: Nearest window that way. Win+Arrows stay Windows snap
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - H
      - Name: Next window on monitor
        Description: Sends the current one to the back
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - J
      - Name: Previous window on monitor
        Description: Brings back the one at the back
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - K
      - Name: Focus window right
        Description: Nearest window that way
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - L
      - Name: Focus monitor left
        Description: Win+Ctrl+Left/Right stay previous/next desktop
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - H
      - Name: Focus monitor right
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - L

  - SectionName: Window Placement
    Properties:
      - Name: Snap window left
        Description: Via FancyZones, as Win+Left
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - H
      - Name: Restore or minimize window
        Description: As Win+Down
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - J
      - Name: Maximize window
        Description: As Win+Up
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - K
      - Name: Snap window right
        Description: Via FancyZones, as Win+Right
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - L
      - Name: Move window to monitor left
        Description: Also Windows' own Win+Shift+Left
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: true
            Alt: false
            Keys:
              - H
      - Name: Move window to monitor right
        Description: Also Windows' own Win+Shift+Right
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: true
            Alt: false
            Keys:
              - L

  - SectionName: Sizing
    Properties:
      - Name: Cycle window width
        Description: 1/3, 1/2 or full width
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - R
      - Name: Narrower / wider
        Description: Add Shift for height
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "-"
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "="

  - SectionName: Virtual Desktops
    Properties:
      - Name: Go to desktop 1-9
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - "1"
      - Name: Move window to desktop 1-9
        Description: Follows the window there
        Recommended: true
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - "1"
      - Name: Next desktop
        Description: Also Win+Ctrl+Right, or scroll down while holding Win
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - U
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - PgDn
      - Name: Previous desktop
        Description: Also Win+Ctrl+Left, or scroll up while holding Win
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - I
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - PgUp
      - Name: Move window to next desktop
        Description: Follows the window there. Also scroll down while holding Win+Ctrl
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - U
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - "<Down>"
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - PgDn
      - Name: Move window to previous desktop
        Description: Follows the window there. Also scroll up while holding Win+Ctrl
        Shortcut:
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - I
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - "<Up>"
          - Win: true
            Ctrl: true
            Shift: false
            Alt: false
            Keys:
              - PgUp

  - SectionName: System
    Properties:
      - Name: Turn off display
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: true
            Alt: false
            Keys:
              - P
      - Name: Pause these shortcuts
        Description: Hand Win chords back to Windows; press again to resume
        Shortcut:
          - Win: true
            Ctrl: false
            Shift: false
            Alt: false
            Keys:
              - Esc
