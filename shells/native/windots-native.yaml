            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - T
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
              - "<Enter>"
          - Win: false
            Ctrl: false
            Shift: false
            Alt: true
            Keys:
