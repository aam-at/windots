[package]
name = "clipboard"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation_Collections", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Graphics_Imaging", "Storage_Streams", "Foundation"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
