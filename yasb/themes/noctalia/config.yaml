watch_stylesheet: true
watch_config: true
debug: false
update_check: true
# Theme "noctalia" (pick it with scripts/Set-YasbTheme.ps1).
# Noctalia-style top bar (~/dotfiles/config/noctalia/config.toml) shared by the
# Native and Komorebi desktop modes: an opaque edge-to-edge gruvbox strip with
# rounded capsules. setup\Install-Startup.ps1 sets YASB_WORKSPACES to
# windows_desktops (native virtual desktops) or komorebi_workspaces per mode.
bars:
  primary-bar:
    enabled: true
    screens: ["primary"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
    animation:
      enabled: true
      duration: 200
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 36
    # Keep 0: YASB draws this padding outside the stylesheet background, so it
    # shows through as a transparent strip. Inner spacing lives in styles.css.
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - "quick_launch"
      - "$env:YASB_WORKSPACES"
      - "active_window"
      center:
      - "media"
      - "clock"
      - "open_meteo"
      right:
      - "systray"
      - "status"
      - "power_menu"
  dock-bar:
    enabled: true
    screens: ["primary"]
    class_name: yasb-dock
    style: "adaptive"
    alignment:
      position: bottom
      align: center
    animation:
      enabled: true
      duration: 200
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: true
      windows_app_bar: false
      auto_hide: true
      hide_on_fullscreen: true
    dimensions:
      width: "auto"
      height: 68
    padding:
      top: 0
      left: 8
      bottom: 0
      right: 8
    widgets:
      left: []
      center:
      - dock_windows
      right: []
widgets:
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span>\ue721</span>"
      search_placeholder: "Search applications..."
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      providers:
        apps:
          enabled: true
          prefix: "*"
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
  windows_desktops:
    type: "yasb.windows_desktops.WorkspaceWidget"
    options:
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: ""
      hide_if_offline: true
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_zero_index: false
      hide_empty_workspaces: true
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[title]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 16
      max_length: 40
      max_length_ellipsis: "…"
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}"
      label_alt: "{artist} - {title}"
      hide_empty: true
      # The default thumbnail is the cover art at half opacity behind the
      # title, which reads as a washed-out box on the capsule.
      show_thumbnail: false
      # Segoe Fluent like the rest of the bar; the FontAwesome defaults render
      # cramped from whatever font happens to have them.
      icons:
        prev_track: ""
        next_track: ""
        play: ""
        pause: ""
  language:
    type: "yasb.language.LanguageWidget"
    options:
      label: "{lang[language_code]}"
      label_alt: "{lang[full_name]}"
  # Status widgets share one capsule, like Noctalia's grouped right section.
  status:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "status"
      widgets: ["language", "wifi", "traffic", "volume", "notifications", "battery"]
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      class_name: "wifi-widget"
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span>{wifi_name}"
      update_interval: 5000
      # Segoe Fluent signal levels (none, 1-3 bars, full); the defaults mix in
      # Nerd Font glyphs that don't match the rest of the bar.
      wifi_icons: ["\ue871", "\ue872", "\ue873", "\ue874", "\ue701"]
  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      class_name: "traffic-widget"
      label: "<span>\ue896</span>{download_speed}<span>\ue898</span>{upload_speed}"
      label_alt: "<span>\ue896</span>{today_downloaded}<span>\ue898</span>{today_uploaded}"
      update_interval: 1000
      hide_decimal: true
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>{percent}%"
      label_alt: "<span>{icon}</span> {time_remaining}"
      hide_unsupported: true
      # Segoe Fluent batteries instead of the FontAwesome defaults.
      status_icons:
        icon_charging: "\uebb5"
        icon_critical: "\ueba0"
        icon_low: "\ueba2"
        icon_medium: "\ueba5"
        icon_high: "\ueba8"
        icon_full: "\uebaa"
      # Default "{charging_icon} {icon}" shows two batteries while charging.
      charging_options:
        icon_format: "{charging_icon}"
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M · %a %d}"
      label_alt: "{%A, %d %B %Y %H:%M}"
      timezones: []
      calendar: 
        blur: true
        round_corners: true
        alignment: "center"
        direction: "down"
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "toggle_label"
        on_right: "context_menu"
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: systray
      label_collapsed: "\ue70d"
      label_expanded: "\ue70e"
      label_position: right
      pin_click_modifier: ctrl
      show_unpinned: false
      show_battery: false
      show_volume: false 
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
  open_meteo:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      label: "<span>\ue706</span>{temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: "metric"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:
        sunnyDay: "\ue706"
        clearNight: "\uec46"
      weather_card:
        blur: true
        alignment: "right"
        direction: "down"
        icon_size: 32
        show_hourly_forecast: true
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 16
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: "#8EAEE8"
        current_line_width: 1
        current_line_style: "dot"
        hourly_forecast_buttons:
          enabled: false
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 1.0
          snow_effect_intensity: 1.0
          scale_with_chance: true
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>{level}"
      tooltip: true
      icons:
        - "\ue74f"
        - "\ue992"
        - "\ue993"
        - "\ue994"
        - "\ue995"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span>\ue712</span>"
      uptime: true
      show_user: true
      menu_style: "popup"
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      profile_image_size: 64
      buttons:
        lock: ["\ue72e", "Lock"]
        signout: ["\uf3b1", "Sign out"]
        sleep: ["\uec46", "Sleep"]
        hibernate: ["\ue66d", "Hibernate"]
        restart: ["\ue72c", "Restart"]
        shutdown: ["\ue7e8", "Shut Down"]
        cancel: ["", "Cancel"]
  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>\uf2a3</span>"
      label_alt: "{count} notifications"
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: "toggle_notification"
        on_right: "do_nothing"
        on_middle: "do_nothing"
  # Pinned apps and running windows in one list: right-click an app to
  # pin/unpin, drag to reorder. Pins live in %LOCALAPPDATA%\Yasb	askbar_pinned.json.
  dock_windows:
    type: yasb.taskbar.TaskbarWidget
    options:
      icon_size: 40
      tooltip: true
      show_only_visible: false
      strict_filtering: true
      hide_empty: false
      grouping:
        enabled: true
        show_count: true
      # YASB 2.0.7 crashes the whole app when a window appears while an icon's
      # animation is being torn down (taskbar.py _add_window_ui: "wrapped C/C++
      # object of type QPropertyAnimation has been deleted").
      animation:
        enabled: false
        duration: 200
      preview:
        enabled: true
        width: 220
        delay: 400
        padding: 8
        margin: 8
        blur: true
        peek: true
      title_label:
        enabled: false
